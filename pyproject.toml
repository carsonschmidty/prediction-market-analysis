[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmflow"
version = "0.1.0"
description = "Informed-flow signal research on geopolitical prediction markets (public data only)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
# Each role adds its own group below; do not edit other roles' groups.
data = []
evaluation = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "pytest>=8", "tabulate>=0.9"]
features = ["numpy>=1.26", "matplotlib>=3.8", "pytest>=8"]
# modeling: LightGBM/sklearn for tabular; JAX CPU + tokenizers/safetensors for the small encoder (PyTorch CPU wheel
# not installable here); onnx/onnxruntime only to validate the JAX encoder against the published ONNX export.
modeling = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "pytest>=8", "lightgbm>=4.5", "scikit-learn>=1.5",
            "jax[cpu]>=0.4.30", "tokenizers>=0.20", "safetensors>=0.4", "onnx>=1.16", "onnxruntime>=1.18",
            "huggingface_hub>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]
